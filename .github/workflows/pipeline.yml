name: Publish to Exchange & Deploy to CH2.0

on:
  push:
    branches: [ develop ]
    
jobs:         
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: 17
     
      - name: Publish to Exchange
        run: |
          mvn clean deploy --settings .maven/settings.xml -DskipMunitTests \
          -Dca_clientID="d86aa66a96814de59d81f4f8851178c7" \
          -Dca_clientSecret="6660Be99c0c9479Eb08155A3cB7598Ec" -e -X
      - name: Deploy to CloudHub 2.0
        run: |
          mvn clean deploy --settings .maven/settings.xml -DskipMunitTests -DmuleDeploy -DskipDeploymentVerification="true" \
          -Dca_clientID="d86aa66a96814de59d81f4f8851178c7" \
          -Dca_clientSecret="6660Be99c0c9479Eb08155A3cB7598Ec" -e -X